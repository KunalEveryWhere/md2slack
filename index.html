<!DOCTYPE html>
<html>
  <head>
    <title>Markdown to Slack Converter</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Convert Markdown to Slack Block Kit JSON." />
    <meta name="keywords" content="Markdown, Slack, Block Kit, JSON, Converter" />
    <link rel="apple-touch-icon" sizes="180x180" href="./public/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./public/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./public/favicon-16x16.png">
    <meta name="msapplication-TileColor" content="#367AEE">
    <meta name="theme-color" content="#367AEE">
  </head>

  <body>
    <main>
      <section>
        <textarea
          placeholder="Type in Markdown..."
          autofocus="autofocus"
        ></textarea>
        <div id="blocks" class="ready">
          A generated JSON for Block Kit will show in this pane.
        </div>
      </section>
      <a
        id="send"
        class="disabled"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        Send to Slack Block Kit Builder...
      </a>
    </main>
    <script src="src/index.js"></script>
  </body>
</html>
